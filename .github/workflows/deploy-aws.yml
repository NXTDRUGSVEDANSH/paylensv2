# Deploy PayLens to a single EC2 box over SSH.
#
#   push to main -> GitHub Actions -> SSH into EC2 -> git pull -> docker build
#   -> replace the container -> check /health
#
# The image is built on the EC2 instance itself, so no registry and no AWS
# credentials are involved. GitHub only needs an SSH key.
#
# Required repository secrets:
#   EC2_HOST     public IPv4 address of the instance
#   EC2_USER     ubuntu
#   EC2_SSH_KEY  private key dedicated to this workflow (its public half is in
#                ~/.ssh/authorized_keys on the instance)
#
# The runtime .env lives only on the instance, at
# /home/ubuntu/projects/paylensv2/.env. It is git-ignored, so `git pull` never
# touches it, and this workflow only passes it to `docker run --env-file`.
name: deploy to aws

on:
  workflow_dispatch:          # deploy on demand, from the Actions tab
  push:
    branches: [main]
    paths:                    # skip the run when only prose changed
      - 'paylens2/**'
      - 'backend/**'
      - 'semantic/**'
      - 'data/**'
      - 'Dockerfile'
      - 'requirements*.txt'
      - '.github/workflows/deploy-aws.yml'

permissions:
  contents: read

# Never run two deploys against the same box at once.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build and restart on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # The build generates the dataset and the views; on a t3.small that
          # can take well over the default 10 minutes.
          command_timeout: 30m
          script: |
            set -euo pipefail

            APP_DIR=/home/ubuntu/projects/paylensv2
            IMAGE=paylens
            CONTAINER=paylens

            cd "$APP_DIR"

            # The container cannot start without its runtime config, and this
            # workflow must never create or overwrite it.
            if [ ! -f .env ]; then
              echo "::error::$APP_DIR/.env is missing; create it on the instance first"
              exit 1
            fi

            echo "==> pulling main"
            git checkout main
            git pull --ff-only origin main
            echo "deploying $(git rev-parse --short HEAD)"

            # Build before touching the running container: a failed build leaves
            # the current version serving.
            echo "==> building image"
            docker build --build-arg WITH_KB=0 -t "$IMAGE" .

            echo "==> replacing container"
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            docker run -d --name "$CONTAINER" --restart unless-stopped \
              --env-file .env -p 80:8000 "$IMAGE"

            # /health returns JSON such as
            #   {"engine":"v2","views_built":true,"llm_available":true,...}
            # It has no "status" field. views_built=true means the app started
            # and found the views baked into the image.
            echo "==> waiting for /health"
            for i in $(seq 1 30); do
              if BODY=$(curl -fsS --max-time 5 http://localhost/health 2>/dev/null) \
                 && echo "$BODY" | grep -q '"views_built": *true'; then
                echo "healthy: $BODY"
                if ! echo "$BODY" | grep -q '"llm_available": *true'; then
                  echo "::warning::llm_available is not true; check LLM_API_KEY in .env"
                fi
                # Drop the previous, now untagged image so the disk does not fill.
                docker image prune -f >/dev/null
                exit 0
              fi
              if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null)" != "true" ]; then
                echo "::error::container is not running"
                break
              fi
              sleep 5
            done

            echo "::error::health check failed"
            echo "last /health response: ${BODY:-<none>}"
            docker ps -a --filter "name=^${CONTAINER}$"
            echo "==> docker logs (last 200 lines)"
            docker logs --tail 200 "$CONTAINER" || true
            exit 1
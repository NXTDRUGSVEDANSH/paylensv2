name: deploy to ec2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Deploy on EC2
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/projects/paylensv2

          echo "-- pull ------------------------------------------"
          git fetch --prune origin main
          git reset --hard origin/main
          git --no-pager log -1 --oneline

          echo "-- check environment -----------------------------"
          test -f .env || {
            echo "::error::.env is missing on the host"
            exit 1
          }

          grep -q '^DISABLE_CHROMA=true' .env || {
            echo "::error::DISABLE_CHROMA=true is required"
            exit 1
          }

          echo "-- build -----------------------------------------"
          docker build --build-arg WITH_KB=0 -t paylens .

          echo "-- restart ---------------------------------------"
          docker rm -f paylens 2>/dev/null || true
          docker run -d --name paylens --restart unless-stopped \
            --env-file .env -p 80:8000 paylens

          echo "-- health ----------------------------------------"
          ok=0

          for i in $(seq 1 40); do
            if curl -fsS http://localhost/health -o /tmp/h.json 2>/dev/null; then
              if grep -q '"views_built":true' /tmp/h.json; then
                ok=1
                break
              fi
            fi
            sleep 5
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::health check failed"
            cat /tmp/h.json 2>/dev/null || true
            docker logs --tail 80 paylens 2>&1 || true
            docker ps -a --filter name=paylens
            exit 1
          fi

          echo "healthy:"
          cat /tmp/h.json
          echo

          docker image prune -f >/dev/null 2>&1 || true
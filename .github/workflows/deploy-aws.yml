# Deploy to EC2 over SSH.
#
# Push to main -> SSH in -> git pull -> docker build -> restart the container.
# No registry, no OIDC, no AWS APIs: the box builds its own image from the code
# it just pulled, which is the least machinery that can work.
name: deploy to ec2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:                 # never let two deploys race on one box
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build and restart on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /home/ubuntu/projects/paylensv2

            echo "-- pull ------------------------------------------"
            git fetch --prune origin main
            git reset --hard origin/main   # the box mirrors main; no local commits to keep
            git --no-pager log -1 --oneline

            echo "-- .env ------------------------------------------"
            # The runtime secrets live only on the box. This deploy never
            # writes, copies or reads that file - it only refuses to start
            # without it, because a container with no key boots cleanly and
            # then fails every question it is asked.
            test -f .env || { echo "::error::.env is missing on the host"; exit 1; }

            # WITH_KB=0 leaves chromadb and onnxruntime out of the image:
            # ~600MB less disk and ~250MB less RAM, which is what makes this
            # fit a t3.small. It requires DISABLE_CHROMA=true, or the app
            # reaches for a store that is not installed.
            grep -q '^DISABLE_CHROMA=true' .env || {
              echo "::error::image is built WITH_KB=0, so .env must set DISABLE_CHROMA=true"
              exit 1
            }

            echo "-- build -----------------------------------------"
            docker build --build-arg WITH_KB=0 -t paylens .

            echo "-- restart ---------------------------------------"
            docker rm -f paylens 2>/dev/null || true
            docker run -d --name paylens --restart unless-stopped \
              --env-file .env -p 80:8000 paylens

            echo "-- health ----------------------------------------"
            # /health returns no 'status' field. What matters is views_built:
            # it separates a container that is merely listening from one that
            # will refuse every question, and only the second is worth
            # catching.
            ok=0
            for i in $(seq 1 40); do
              if curl -fsS http://localhost/health -o /tmp/h.json 2>/dev/null; then
                if grep -q '"views_built":true' /tmp/h.json; then ok=1; break; fi
              fi
              sleep 5
            done

            if [ "$ok" -ne 1 ]; then
              echo "::error::health check failed"
              echo "-- last response --"; cat /tmp/h.json 2>/dev/null || echo "(none)"
              echo "-- container logs --"; docker logs --tail 80 paylens 2>&1 || true
              echo "-- state --"; docker ps -a --filter name=paylens
              exit 1
            fi

            echo "healthy:"; cat /tmp/h.json; echo
            docker image prune -f >/dev/null 2>&1 || true  # drop layers the rebuild orphaned

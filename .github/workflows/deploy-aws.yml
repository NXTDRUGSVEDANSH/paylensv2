# Deploy PayLens on the EC2 box itself, through a self-hosted GitHub runner.
#
#   push to main -> runner on EC2 picks up the job -> git pull -> docker build
#   -> replace the container -> check /health
#
# No SSH, no registry, no AWS credentials and no repository secrets. The runner
# runs as `ubuntu` on the instance and works in the existing clone at
# /home/ubuntu/projects/paylensv2.
#
# The runtime .env lives only in that clone. It is git-ignored, so `git pull`
# never touches it, and this workflow only reads it through
# `docker run --env-file`.
#
# ONE-TIME RUNNER SETUP (on the EC2 instance, as ubuntu)
# ------------------------------------------------------
# 1. GitHub repo -> Settings -> Actions -> Runners -> New self-hosted runner ->
#    Linux / x64. Copy the download URL and the registration token shown there.
# 2. Install and register:
#      mkdir -p ~/actions-runner && cd ~/actions-runner
#      curl -o runner.tar.gz -L <download URL from that page>
#      tar xzf runner.tar.gz
#      ./config.sh --url https://github.com/<owner>/<repo> --token <token> \
#        --name paylens-ec2 --labels self-hosted --unattended
# 3. Let ubuntu use Docker without sudo (skip if `docker ps` already works):
#      sudo usermod -aG docker ubuntu     # then log out and back in
# 4. Run it as a service so it survives logouts and reboots:
#      sudo ./svc.sh install ubuntu
#      sudo ./svc.sh start
#      sudo ./svc.sh status
# 5. The runner should show as "Idle" under Settings -> Actions -> Runners.
#
# The runner connects outbound to GitHub over 443; no inbound port is needed
# for deploys.
name: deploy to aws

on:
  workflow_dispatch:          # deploy on demand, from the Actions tab
  push:
    branches: [main]
    paths:                    # skip the run when only prose changed
      - 'paylens2/**'
      - 'backend/**'
      - 'semantic/**'
      - 'data/**'
      - 'Dockerfile'
      - 'requirements*.txt'
      - '.github/workflows/deploy-aws.yml'

permissions:
  contents: read

# Never run two deploys against the same box at once; a queued one waits.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

env:
  APP_DIR: /home/ubuntu/projects/paylensv2
  IMAGE: paylens
  CONTAINER: paylens

defaults:
  run:
    shell: bash
    working-directory: /home/ubuntu/projects/paylensv2

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      # The container cannot start without its runtime config, and this
      # workflow must never create or overwrite it.
      - name: Check .env exists
        run: |
          if [ ! -f .env ]; then
            echo "::error::$APP_DIR/.env is missing; create it on the instance first"
            exit 1
          fi

      - name: Pull main
        run: |
          git checkout main
          git pull --ff-only origin main
          echo "deploying $(git rev-parse --short HEAD)"

      # Build before touching the running container: a failed build leaves the
      # current version serving.
      - name: Build image
        run: docker build --build-arg WITH_KB=0 -t "$IMAGE" .

      - name: Replace container
        run: |
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          docker run -d --name "$CONTAINER" --restart unless-stopped \
            --env-file .env -p 80:8000 "$IMAGE"

      # /health returns JSON such as
      #   {"engine":"v2","views_built":true,"llm_available":true,...}
      # It has no "status" field. views_built=true means the app started and
      # found the views baked into the image.
      - name: Check /health
        run: |
          BODY=""
          for i in $(seq 1 30); do
            if BODY=$(curl -fsS --max-time 5 http://localhost/health 2>/dev/null) \
               && echo "$BODY" | grep -q '"views_built": *true'; then
              echo "healthy: $BODY"
              if ! echo "$BODY" | grep -q '"llm_available": *true'; then
                echo "::warning::llm_available is not true; check LLM_API_KEY in .env"
              fi
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null)" != "true" ]; then
              echo "::error::container is not running"
              break
            fi
            sleep 5
          done
          echo "::error::views_built is not true"
          echo "last /health response: ${BODY:-<none>}"
          exit 1

      # Drop the previous, now untagged image so the disk does not fill.
      - name: Prune old images
        run: docker image prune -f

      - name: Show container logs on failure
        if: failure()
        run: |
          docker ps -a --filter "name=^${CONTAINER}$"
          docker logs --tail 200 "$CONTAINER" || true
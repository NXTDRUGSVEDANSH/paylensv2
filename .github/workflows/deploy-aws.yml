# Build the image on GitHub, push it to ECR, and roll App Runner onto it.
#
# WHY THIS EXISTS RATHER THAN A LOCAL SCRIPT
# ------------------------------------------
# The image bakes the dataset, the analytical views and the embedding model, so
# building it needs Docker and several GB of scratch space. Doing that on a
# laptop means everyone who deploys needs the same toolchain and the same
# version of it. GitHub's runners already have Docker, and the credentials stay
# in GitHub rather than on anyone's disk.
#
# AUTHENTICATION USES OIDC, NOT STORED KEYS
# -----------------------------------------
# GitHub mints a short-lived token and AWS trades it for temporary credentials
# scoped to one role. There is no long-lived access key to leak, rotate or
# accidentally commit. Setup is in docs/AWS-DEPLOY.md.
name: deploy to aws

on:
  workflow_dispatch:          # deploy on demand, from the Actions tab
  push:
    branches: [main]
    paths:                    # skip the run when only prose changed
      - 'paylens2/**'
      - 'backend/**'
      - 'semantic/**'
      - 'data/**'
      - 'Dockerfile'
      - 'requirements*.txt'
      - '.github/workflows/deploy-aws.yml'

permissions:
  id-token: write             # required for OIDC
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: paylens
  APPRUNNER_SERVICE: paylens

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create the ECR repository if it does not exist
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" >/dev/null 2>&1 \
          || aws ecr create-repository --repository-name "$ECR_REPOSITORY" \
               --region "$AWS_REGION" --image-scanning-configuration scanOnPush=true

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          # linux/amd64 explicitly. An arm64 image pulls fine on x86 Fargate and
          # then fails to start, with an error that does not mention architecture.
          docker build --platform linux/amd64 \
            -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
          echo "IMAGE_URI=$IMAGE:${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Create or update the App Runner service
        run: |
          ARN=$(aws apprunner list-services --region "$AWS_REGION" \
                  --query "ServiceSummaryList[?ServiceName=='$APPRUNNER_SERVICE'].ServiceArn" \
                  --output text)

          # The key is read from Secrets Manager at container start, never
          # baked into the image and never an env var in plaintext.
          SECRET_ARN="${{ secrets.LLM_API_KEY_SECRET_ARN }}"

          CONFIG=$(cat <<JSON
          {
            "ImageRepository": {
              "ImageIdentifier": "$IMAGE_URI",
              "ImageRepositoryType": "ECR",
              "ImageConfiguration": {
                "Port": "8000",
                "RuntimeEnvironmentVariables": {
                  "DUCKDB_PATH": "/app/data/paylens.duckdb",
                  "CHROMA_PATH": "/app/data/chroma_db",
                  "DUCKDB_MEMORY_LIMIT": "512MB",
                  "MAX_SQL_ROWS": "5000",
                  "SQL_TIMEOUT_S": "10"
                },
                "RuntimeEnvironmentSecrets": {
                  "LLM_API_KEY": "$SECRET_ARN"
                }
              }
            },
            "AutoDeploymentsEnabled": false,
            "AuthenticationConfiguration": {
              "AccessRoleArn": "${{ secrets.AWS_ECR_ACCESS_ROLE_ARN }}"
            }
          }
          JSON
          )

          if [ -z "$ARN" ]; then
            echo "creating $APPRUNNER_SERVICE"
            aws apprunner create-service --region "$AWS_REGION" \
              --service-name "$APPRUNNER_SERVICE" \
              --source-configuration "$CONFIG" \
              --instance-configuration 'Cpu=1024,Memory=2048' \
              --health-check-configuration \
                 'Protocol=HTTP,Path=/health,Interval=20,Timeout=5,HealthyThreshold=1,UnhealthyThreshold=5'
            ARN=$(aws apprunner list-services --region "$AWS_REGION" \
                    --query "ServiceSummaryList[?ServiceName=='$APPRUNNER_SERVICE'].ServiceArn" \
                    --output text)
          else
            echo "updating $APPRUNNER_SERVICE"
            aws apprunner update-service --region "$AWS_REGION" \
              --service-arn "$ARN" --source-configuration "$CONFIG"
          fi

          echo "waiting for the service to settle"
          for i in $(seq 1 40); do
            STATUS=$(aws apprunner describe-service --region "$AWS_REGION" \
                       --service-arn "$ARN" --query 'Service.Status' --output text)
            echo "  $STATUS"
            case "$STATUS" in
              RUNNING) break ;;
              CREATE_FAILED|DELETE_FAILED) echo "::error::service is $STATUS"; exit 1 ;;
            esac
            sleep 15
          done

          URL=$(aws apprunner describe-service --region "$AWS_REGION" \
                  --service-arn "$ARN" --query 'Service.ServiceUrl' --output text)
          echo "### PayLens deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "https://$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Check it actually answers
        run: |
          ARN=$(aws apprunner list-services --region "$AWS_REGION" \
                  --query "ServiceSummaryList[?ServiceName=='$APPRUNNER_SERVICE'].ServiceArn" \
                  --output text)
          URL=$(aws apprunner describe-service --region "$AWS_REGION" \
                  --service-arn "$ARN" --query 'Service.ServiceUrl' --output text)
          # /health reports whether the views are built and a model is wired up,
          # not merely that the process is listening — which is the failure this
          # deployment has actually had before.
          for i in $(seq 1 10); do
            if curl -fsS "https://$URL/health" | tee /tmp/h.json | grep -q '"views_built": *true'; then
              echo "healthy:"; cat /tmp/h.json; exit 0
            fi
            sleep 10
          done
          echo "::error::service did not report views_built=true"; cat /tmp/h.json || true; exit 1
